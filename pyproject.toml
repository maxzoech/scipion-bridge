[project]
name = "scipion-bridge"
version = "0.1.0"
description = "A Python tool to convert validation data on VRS to a format compatible with 3DBionotes"
authors = [{ name = "Max Zoech", email = "maximilian.zoech@cnb.csic.es" }]
readme = "README.md"
requires-python = ">=3.8,<3.13"
dependencies = [
    "dependency-injector>=4.48.1,<5.0.0",
    "networkx>=3.0.0,<4.0.0",
    "tabulate>=0.9.0,<0.10.0",
    "numpy>=1.24.4,<2.0.0; python_version < '3.9'",
    "numpy>=1.26.0; python_version >= '3.9'",
    "pyrsistent>=0.20.0,<0.21.0",
    "mrcfile>=1.4.3,<2.0.0",
    "starfile>=0.5.2,<0.6.0",
    "tqdm>=4.70.0,<5.0.0",
    "pyinstrument>=5.1.3,<6.0.0",
    "pyarrow>=14.0.0",
    "awkward>=2.6.0",
    "cloudpickle>=3.0.0",
    "xxhash>=3.0.0",
    "watchfiles>=1.0.0",
]

[project.optional-dependencies]
pyworkflow = [
    "scipion-pyworkflow>=3.11,<4.0",
    "scipion-em>=3.11,<4.0",
    "zarr>=2.16.1,<3.0.0",
    "xmipp-metadata>=1.3.0",
]
ray = [
    "ray>=2.49.0",
    "tensorstore>=0.1.45",
]

[project.entry-points."scipion_bridge.protocols"]
canonical_imports = "scipion_bridge.utils.protocols.imports:synthesize_import_protocols"

[tool.poetry]
packages = [{ include = "scipion_bridge", from = "src" }]

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
pytest = "^8.3.5"
pytest-mock = "*"
pytest-cov = "*"
pytest-xdist = "*"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
markers = [
    "ray: runs on the Ray test cluster, added to every test using the ray_cluster fixture; deselect with -m 'not ray'",
    "timing: asserts timing or scheduling relations, added to every test of the xdist group 'timing'; CI runs them alone",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def print_schema",
    "def print_storage",
    "def print_tree",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
mypy_path = "src"
explicit_package_bases = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
check_untyped_defs = false
