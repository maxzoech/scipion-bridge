# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Testing

on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-mock pytest-cov pytest-xdist ".[ray]"
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Test without Ray
        run: |
          python -m pytest -m "not ray" --cov=scipion_bridge --cov-report= tests
      - name: Test on Ray
        run: |
          # Every xdist worker starts a Ray cluster of its own; the modules with
          # timing assertions share the xdist group "timing" and run on one worker.
          python -m pytest -m ray -n auto --dist loadgroup --cov=scipion_bridge --cov-append tests
